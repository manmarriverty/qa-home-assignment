name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Build
      run: dotnet build --no-restore
    
    - name: Run Integration Tests
      run: dotnet test CardValidation.IntegrationTests/CardValidation.IntegrationTests.csproj --no-build --verbosity normal --collect:"XPlat Code Coverage" --results-directory:./TestResults/Integration
      continue-on-error: true
    
    - name: Run Unit Tests
      run: dotnet test CardValidation.Core.Tests/CardValidation.Core.Tests.csproj --no-build --verbosity normal --collect:"XPlat Code Coverage" --results-directory:./TestResults/Unit
      continue-on-error: true
    
    - name: Publish Test Results
      uses: EnricoMi/publish-unit-test-result-action@v2
      if: always()
      with:
        files: TestResults/Unit/**/*.trx
    
    - name: Upload Coverage Reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-reports
        path: TestResults/Unit/**/coverage.cobertura.xml
        retention-days: 30

